<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Modern Units - % & vw/vh Practical</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .demo {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .percent-parent {
      width: 80%;
      background: #333;
      padding: 20px;
      border-radius: 8px;
    }

    .percent-child {
      width: 50%;
      background: #e50914;
      padding: 10px;
      border-radius: 6px;
      color: #fff;
    }

    .full-height {
      height: 100vh;
      background: linear-gradient(135deg, #e50914, #b81d24);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .full-height h2 {
      font-size: clamp(1.5rem, 4vw, 3rem);
    }

    .poster {
      width: 120px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>CSS Modern Units</h1>
  <p class="lesson-title">Percentage & Practical Viewport Units</p>

  <div class="section">
    <h2>Percentage</h2>
    <p><code>%</code> is relative to the parent element size. Here the child is <code>50%</code> of its parent.</p>
    <div class="demo">
      <div class="percent-parent">
        <div class="percent-child">50% width of parent</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Full Viewport Height</h2>
    <p><code>100vh</code> makes an element take the full height of the viewport.</p>
    <div class="full-height">
      <div>
        <h2>Hero Section</h2>
        <p>This section is 100vh tall</p>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/vh1/400/600'); margin: 10px auto;"></div>
      </div>
    </div>
  </div>

</body>
</html>
