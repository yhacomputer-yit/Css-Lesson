<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Positioning - Sticky</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .scroll-area {
      height: 300px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .sticky-bar {
      position: sticky;
      top: 0;
      background: #e50914;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      text-align: center;
      z-index: 5;
    }

    .poster {
      width: 100px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .content {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <h1>CSS Positioning</h1>
  <p class="lesson-title">Sticky</p>

  <div class="section">
    <p><code>position: sticky</code> toggles between relative and fixed depending on scroll position. It stays within its parent container.</p>
    <div class="scroll-area">
      <div class="sticky-bar">Sticky Header</div>
      <div class="content">
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos20/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos21/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos22/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos23/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos24/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos25/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos26/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/pos27/400/600');"></div>
      </div>
    </div>
  </div>

</body>
</html>
