<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Positioning - Static & Relative</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .stage {
      position: relative;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 20px;
      min-height: 200px;
      margin-bottom: 20px;
    }

    .poster {
      width: 100px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    .static {
      position: static;
    }

    .relative {
      position: relative;
      top: 10px;
      left: 20px;
      border: 2px dashed #e50914;
    }
  </style>
</head>
<body>

  <h1>CSS Positioning</h1>
  <p class="lesson-title">Static & Relative</p>

  <div class="section">
    <h2>static</h2>
    <p><code>position: static</code> is the default. The element follows normal document flow and ignores <code>top</code>, <code>left</code>, etc.</p>
    <div class="stage">
      <div class="poster static" style="background-image: url('https://picsum.photos/seed/pos1/400/600');"></div>
      <div class="poster static" style="background-image: url('https://picsum.photos/seed/pos2/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>relative</h2>
    <p><code>position: relative</code> keeps the element in normal flow, but you can offset it with <code>top</code>, <code>left</code>, <code>right</code>, <code>bottom</code>. The original space is preserved.</p>
    <div class="stage">
      <div class="poster relative" style="background-image: url('https://picsum.photos/seed/pos3/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/pos4/400/600');"></div>
    </div>
  </div>

</body>
</html>
