<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid - Basic Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid-basic {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .grid-basic .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }

    .grid-basic .poster:hover {
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .grid-basic {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <h1>CSS Grid</h1>
  <p class="lesson-title">Basic Grid - 3 Equal Columns</p>

  <div class="section">
    <p>A simple 3-column grid using <code>grid-template-columns: repeat(3, 1fr)</code>. Each poster takes an equal share of the row.</p>
    <div class="grid-basic">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie1/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie2/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie3/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie4/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie5/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie6/400/600');"></div>
    </div>
  </div>

</body>
</html>
