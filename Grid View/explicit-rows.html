<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid - Explicit Rows</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid-rows {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 80px 120px 160px;
      gap: 10px;
    }

    .poster {
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .grid-rows {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
      }
    }
  </style>
</head>
<body>

  <h1>CSS Grid</h1>
  <p class="lesson-title">Explicit Rows</p>

  <div class="section">
    <p>Use <code>grid-template-rows</code> to define exact row heights: <code>80px 120px 160px</code>.</p>
    <div class="grid-rows">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row1/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row2/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row3/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row4/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row5/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row6/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row7/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row8/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/row9/400/600');"></div>
    </div>
  </div>

</body>
</html>
