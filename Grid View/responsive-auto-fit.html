<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid - Responsive Auto-fit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid-responsive {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .grid-responsive .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>CSS Grid</h1>
  <p class="lesson-title">Responsive Auto-fit Grid</p>

  <div class="section">
    <p>Using <code>repeat(auto-fit, minmax(150px, 1fr))</code> makes the grid automatically adjust the number of columns based on screen width.</p>
    <div class="grid-responsive">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie19/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie20/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie21/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie22/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie23/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie24/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie25/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie26/400/600');"></div>
    </div>
  </div>

</body>
</html>
