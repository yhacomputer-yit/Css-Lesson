<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid - Gap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid-gap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    .grid-column-gap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 40px;
      row-gap: 10px;
    }

    @media (max-width: 600px) {
      .grid-gap, .grid-column-gap {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <h1>CSS Grid</h1>
  <p class="lesson-title">Gap</p>

  <div class="section">
    <h2>Shorthand gap</h2>
    <p><code>gap: 20px</code> applies equal spacing between rows and columns.</p>
    <div class="grid-gap">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap1/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap2/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap3/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap4/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap5/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap6/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>column-gap / row-gap</h2>
    <p>You can control row and column spacing independently: <code>column-gap: 40px</code> and <code>row-gap: 10px</code>.</p>
    <div class="grid-column-gap">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap7/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap8/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap9/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap10/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap11/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/gap12/400/600');"></div>
    </div>
  </div>

</body>
</html>
