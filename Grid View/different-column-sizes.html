<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid - Different Column Sizes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid-cols-different {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
    }

    .grid-cols-different .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    .grid-cols-different .poster.featured {
      grid-row: span 2;
    }

    @media (max-width: 600px) {
      .grid-cols-different {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>CSS Grid</h1>
  <p class="lesson-title">Different Column Sizes</p>

  <div class="section">
    <p>The first column is <code>2fr</code> (wider) while the others are <code>1fr</code>. The featured poster spans 2 rows with <code>grid-row: span 2</code>.</p>
    <div class="grid-cols-different">
      <div class="poster featured" style="background-image: url('https://picsum.photos/seed/movie7/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie8/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie9/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie10/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/movie11/400/600');"></div>
    </div>
  </div>

</body>
</html>
