<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Media Queries - Orientation & Resolution</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid {
      display: grid;
      gap: 15px;
    }

    .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    .orientation .grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .orientation-portrait .grid {
      grid-template-columns: 1fr;
    }

    @media (orientation: portrait) {
      .orientation .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (orientation: landscape) {
      .orientation-portrait .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .resolution-demo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .poster-retina {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    @media (min-resolution: 2dppx) {
      .poster-retina {
        border: 3px solid #e50914;
      }
    }
  </style>
</head>
<body>

  <h1>CSS Media Queries</h1>
  <p class="lesson-title">Orientation & Resolution</p>

  <div class="section">
    <h2>orientation</h2>
    <p><code>orientation: portrait</code> matches tall screens, <code>landscape</code> matches wide screens.</p>
    <div class="orientation">
      <div class="grid">
        <div class="poster" style="background-image: url('https://picsum.photos/seed/mq30/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/mq31/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/mq32/400/600');"></div>
      </div>
    </div>
    <div class="orientation-portrait" style="margin-top: 20px;">
      <div class="grid">
        <div class="poster" style="background-image: url('https://picsum.photos/seed/mq33/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/mq34/400/600');"></div>
        <div class="poster" style="background-image: url('https://picsum.photos/seed/mq35/400/600');"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>resolution</h2>
    <p><code>min-resolution: 2dppx</code> targets high-DPI/retina screens. Resize or test on a high-res device.</p>
    <div class="resolution-demo">
      <div class="poster-retina" style="background-image: url('https://picsum.photos/seed/mq40/400/600');"></div>
      <div class="poster-retina" style="background-image: url('https://picsum.photos/seed/mq41/400/600');"></div>
      <div class="poster-retina" style="background-image: url('https://picsum.photos/seed/mq42/400/600');"></div>
    </div>
  </div>

</body>
</html>
