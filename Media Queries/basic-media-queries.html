<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Media Queries - Basics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 400px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>CSS Media Queries</h1>
  <p class="lesson-title">Basics - Breakpoints</p>

  <div class="section">
    <p>Use <code>@media (max-width: ...)</code> to apply styles at different screen sizes. Resize the browser to see the grid change.</p>
    <div class="grid">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq1/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq2/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq3/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq4/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq5/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq6/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq7/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq8/400/600');"></div>
    </div>
  </div>

</body>
</html>
