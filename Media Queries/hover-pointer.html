<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Media Queries - Hover & Pointer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      cursor: pointer;
    }

    .poster-hover {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      border: 3px solid transparent;
    }

    @media (hover: hover) {
      .poster-hover:hover {
        border-color: #e50914;
        transform: scale(1.05);
      }
    }

    @media (hover: none) {
      .poster-hover {
        border-color: #e50914;
      }
    }

    @media (pointer: coarse) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .poster {
        min-height: 200px;
      }
    }

    @media (pointer: fine) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

  <h1>CSS Media Queries</h1>
  <p class="lesson-title">Hover & Pointer</p>

  <div class="section">
    <h2>hover</h2>
    <p><code>hover: hover</code> detects if the primary input can hover. <code>hover: none</code> detects touch devices.</p>
    <div class="grid">
      <div class="poster-hover" style="background-image: url('https://picsum.photos/seed/mq80/400/600');"></div>
      <div class="poster-hover" style="background-image: url('https://picsum.photos/seed/mq81/400/600');"></div>
      <div class="poster-hover" style="background-image: url('https://picsum.photos/seed/mq82/400/600');"></div>
      <div class="poster-hover" style="background-image: url('https://picsum.photos/seed/mq83/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>pointer</h2>
    <p><code>pointer: coarse</code> targets touchscreens. <code>pointer: fine</code> targets mice/trackpads.</p>
    <div class="grid">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq90/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq91/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq92/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/mq93/400/600');"></div>
    </div>
  </div>

</body>
</html>
