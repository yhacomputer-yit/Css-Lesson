<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Flexbox - Align Self & Order</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .flex {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
      height: 220px;
      margin-bottom: 30px;
    }

    .poster {
      width: 90px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
    }

    .poster.self-start {
      align-self: flex-start;
    }

    .poster.self-center {
      align-self: center;
    }

    .poster.self-end {
      align-self: flex-end;
    }

    .poster.order-1 {
      order: 1;
    }

    .poster.order-2 {
      order: 2;
    }

    .poster.order-3 {
      order: 3;
    }
  </style>
</head>
<body>

  <h1>CSS Flexbox</h1>
  <p class="lesson-title">Align Self & Order</p>

  <div class="section">
    <h2>align-self</h2>
    <p>Overrides <code>align-items</code> for a single item: <code>flex-start</code>, <code>center</code>, <code>flex-end</code>.</p>
    <div class="flex">
      <div class="poster self-start" style="background-image: url('https://picsum.photos/seed/as1/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/as2/400/600');"></div>
      <div class="poster self-end" style="background-image: url('https://picsum.photos/seed/as3/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>order</h2>
    <p>Controls visual order without changing HTML: <code>order: 1</code>, <code>order: 2</code>, <code>order: 3</code>.</p>
    <div class="flex">
      <div class="poster order-3" style="background-image: url('https://picsum.photos/seed/od1/400/600');"></div>
      <div class="poster order-1" style="background-image: url('https://picsum.photos/seed/od2/400/600');"></div>
      <div class="poster order-2" style="background-image: url('https://picsum.photos/seed/od3/400/600');"></div>
    </div>
  </div>

</body>
</html>
