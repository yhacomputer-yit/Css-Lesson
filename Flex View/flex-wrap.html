<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Flexbox - Flex Wrap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .flex-nowrap {
      display: flex;
      flex-wrap: nowrap;
      gap: 15px;
      overflow-x: auto;
    }

    .flex-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .poster {
      width: 120px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1>CSS Flexbox</h1>
  <p class="lesson-title">Flex Wrap</p>

  <div class="section">
    <h2>1. No Wrap</h2>
    <p><code>flex-wrap: nowrap</code> — items stay on one line and shrink if needed.</p>
    <div class="flex-nowrap">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex10/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex11/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex12/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex13/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex14/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex15/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>2. Wrap</h2>
    <p><code>flex-wrap: wrap</code> — items wrap onto new lines when they run out of space.</p>
    <div class="flex-wrap">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex16/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex17/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex18/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex19/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex20/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex21/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex22/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex23/400/600');"></div>
    </div>
  </div>

</body>
</html>
