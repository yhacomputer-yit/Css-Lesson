<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Flexbox - Align Items</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .flex {
      display: flex;
      gap: 15px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
      height: 250px;
      margin-bottom: 30px;
    }

    .poster {
      width: 100px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
    }

    .poster.tall {
      height: 180px;
      width: auto;
    }

    .poster.short {
      height: 120px;
      width: auto;
    }

    .align-start {
      align-items: flex-start;
    }

    .align-center {
      align-items: center;
    }

    .align-end {
      align-items: flex-end;
    }

    .align-stretch {
      align-items: stretch;
    }

    .align-stretch .poster {
      height: auto;
    }
  </style>
</head>
<body>

  <h1>CSS Flexbox</h1>
  <p class="lesson-title">Align Items</p>

  <div class="section">
    <h2>flex-start</h2>
    <p><code>align-items: flex-start</code> — items align to the top.</p>
    <div class="flex align-start">
      <div class="poster tall" style="background-image: url('https://picsum.photos/seed/flex50/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex51/400/600');"></div>
      <div class="poster short" style="background-image: url('https://picsum.photos/seed/flex52/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>center</h2>
    <p><code>align-items: center</code> — items are vertically centered.</p>
    <div class="flex align-center">
      <div class="poster tall" style="background-image: url('https://picsum.photos/seed/flex53/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex54/400/600');"></div>
      <div class="poster short" style="background-image: url('https://picsum.photos/seed/flex55/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>flex-end</h2>
    <p><code>align-items: flex-end</code> — items align to the bottom.</p>
    <div class="flex align-end">
      <div class="poster tall" style="background-image: url('https://picsum.photos/seed/flex56/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex57/400/600');"></div>
      <div class="poster short" style="background-image: url('https://picsum.photos/seed/flex58/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>stretch</h2>
    <p><code>align-items: stretch</code> — items stretch to fill the container height.</p>
    <div class="flex align-stretch">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex59/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex60/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex61/400/600');"></div>
    </div>
  </div>

</body>
</html>
