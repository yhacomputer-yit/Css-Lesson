<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Flexbox - Centering</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .flex-center {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #222;
      padding: 30px;
      border-radius: 8px;
      height: 300px;
      margin-bottom: 30px;
    }

    .flex-center .poster {
      width: 160px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .flex-gap-center {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: #222;
      padding: 30px;
      border-radius: 8px;
      height: 300px;
    }

    .poster {
      width: 120px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>CSS Flexbox</h1>
  <p class="lesson-title">Centering with Flexbox</p>

  <div class="section">
    <h2>Perfect Centering</h2>
    <p>Using <code>justify-content: center</code> + <code>align-items: center</code> perfectly centers items both horizontally and vertically.</p>
    <div class="flex-center">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex90/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>Centering Multiple Items</h2>
    <p>This also works for multiple items with <code>gap</code> for spacing.</p>
    <div class="flex-gap-center">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex91/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex92/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex93/400/600');"></div>
    </div>
  </div>

</body>
</html>
