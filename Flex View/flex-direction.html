<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Flexbox - Flex Direction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .flex-row {
      display: flex;
      flex-direction: row;
      gap: 15px;
    }

    .flex-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 200px;
    }

    .flex-row-reverse {
      display: flex;
      flex-direction: row-reverse;
      gap: 15px;
    }

    .poster {
      width: 120px;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .flex-row, .flex-row-reverse {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <h1>CSS Flexbox</h1>
  <p class="lesson-title">Flex Direction</p>

  <div class="section">
    <h2>1. Row (Default)</h2>
    <p><code>flex-direction: row</code> — items are placed left to right.</p>
    <div class="flex-row">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex1/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex2/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex3/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>2. Column</h2>
    <p><code>flex-direction: column</code> — items are stacked vertically.</p>
    <div class="flex-column">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex4/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex5/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex6/400/600');"></div>
    </div>
  </div>

  <div class="section">
    <h2>3. Row Reverse</h2>
    <p><code>flex-direction: row-reverse</code> — items are placed right to left.</p>
    <div class="flex-row-reverse">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex7/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex8/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/flex9/400/600');"></div>
    </div>
  </div>

</body>
</html>
