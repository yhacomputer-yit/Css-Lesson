<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Variables - calc() & Dynamic Values</title>
  <style>
    :root {
      --columns: 4;
      --gap: 20px;
      --base-size: 14px;
      --scale: 1.2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lesson-title {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h2 {
      border-bottom: 2px solid #e50914;
      padding-bottom: 5px;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .section p {
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: Consolas, Monaco, monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--columns), 1fr);
      gap: var(--gap);
      margin-bottom: 20px;
    }

    .poster {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 12px;
    }

    .dynamic-text {
      font-size: calc(var(--base-size) * var(--scale));
      background: #e50914;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      :root {
        --columns: 2;
        --gap: 10px;
      }
    }
  </style>
</head>
<body>

  <h1>CSS Variables</h1>
  <p class="lesson-title">calc() & Dynamic Values</p>

  <div class="section">
    <p>Use variables inside <code>calc()</code> to compute dynamic values. Change <code>--columns</code>, <code>--gap</code>, or <code>--scale</code> to update layout and typography.</p>
    <div class="dynamic-text">
      This text size is calc(14px * 1.2)
    </div>
    <div class="grid">
      <div class="poster" style="background-image: url('https://picsum.photos/seed/var40/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/var41/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/var42/400/600');"></div>
      <div class="poster" style="background-image: url('https://picsum.photos/seed/var43/400/600');"></div>
    </div>
  </div>

</body>
</html>
